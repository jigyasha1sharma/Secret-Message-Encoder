<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secret Message Encoder</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Secret Message Encoder</h1>
            <p>Turn ordinary text into secret messages.</p>
        </header>

        <main>

            <section class="message-section">

                <label for="inputText">Your Message</label>

                <textarea
                    id="inputText"
                    placeholder="Type your message here..."
                    rows="5"
                ></textarea>

                <p id="inputError" class="error-message"></p>

            </section>


            <section class="settings-section">

                <div class="form-group">
                    <label for="method">Choose a Method</label>

                    <select id="method">
                        <option value="caesar">Caesar Cipher</option>
                        <option value="binary">Binary Converter</option>
                        <option value="base64">Base64</option>
                        <option value="reverse">Reverse Text</option>
                    </select>
                </div>

                <div class="form-group" id="shiftGroup">
                    <label for="shiftValue">Shift Value</label>

                    <input
                        type="number"
                        id="shiftValue"
                        value="3"
                        min="0"
                        max="25"
                    >
                </div>

            </section>

            <section class="actions">

                <button type="button" id="encodeBtn">
                    Encode Message
                </button>
                <button type="button" id="decodeBtn">
                    Decode Message
                </button>
                <button type="button" id="clearBtn">
                    Clear
                </button>

            </section>

            <section class="result-section">

                <div class="result-header">
                    <label for="outputText">Result</label>
                    <button type="button" id="copyBtn">
                        Copy
                    </button>
                </div>

                <textarea
                    id="outputText"
                    placeholder="Your result will appear here..."
                    rows="5"
                    readonly
                ></textarea>

                <p id="resultMessage" role="status"></p>

            </section>

            <section class="history-section">

                <div class="history-header">
                    <h2>Recent Conversions</h2>

                    <button type="button" id="clearHistoryBtn">
                        Clear History
                    </button>
                </div>

                <ul id="historyList">
                    <li class="empty-message">
                        No conversions yet.
                    </li>
                </ul>

            </section>

        </main>

        <footer>
            <p>Made with JavaScript.</p>
            <p class="disclaimer">
                Educational project only. These methods are not secure encryption.
            </p>
        </footer>
    </div>
    <script src="script.js"></script>

</body>

</html>
